<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="strBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#1b2434"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#strBg)"/>
  <!-- Power Cage Graphic -->
  <rect x="250" y="180" width="20" height="320" rx="4" fill="#334155"/>
  <rect x="530" y="180" width="20" height="320" rx="4" fill="#334155"/>
  <rect x="250" y="180" width="300" height="20" rx="4" fill="#1e293b"/>
  <rect x="250" y="480" width="300" height="20" rx="4" fill="#1e293b"/>
  <!-- Olympic Barbell mounted in rack -->
  <line x1="160" y1="300" x2="640" y2="300" stroke="#f8fafc" stroke-width="8"/>
  <rect x="210" y="240" width="18" height="120" rx="5" fill="#fd761a"/>
  <rect x="228" y="250" width="14" height="100" rx="4" fill="#1e293b"/>
  <rect x="558" y="250" width="14" height="100" rx="4" fill="#1e293b"/>
  <rect x="572" y="240" width="18" height="120" rx="5" fill="#fd761a"/>
  <!-- Safety pins -->
  <line x1="250" y1="360" x2="550" y2="360" stroke="#fd761a" stroke-width="4"/>
  <!-- Bench in cage -->
  <rect x="360" y="400" width="80" height="100" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>

  <!-- Badge -->
  <rect x="230" y="70" width="340" height="56" rx="28" fill="#0d1c32" stroke="#fd761a" stroke-width="2"/>
  <text x="400" y="106" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="4">STRENGTH &amp; POWER</text>
  <text x="400" y="145" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle">OLYMPIC RACKS • POWERLIFTING PLATFORM</text>
</svg>
