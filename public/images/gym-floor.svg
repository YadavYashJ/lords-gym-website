<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd761a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#floorGrad)"/>
  <!-- Floor Grid -->
  <path d="M0 400 L800 400 M0 450 L800 450 M0 510 L800 510 M0 580 L800 580" stroke="#1f2937" stroke-width="2"/>
  <path d="M50 600 L250 400 M200 600 L320 400 M400 600 L400 400 M600 600 L480 400 M750 600 L550 400" stroke="#1f2937" stroke-width="2"/>
  
  <!-- LED Ceiling Neon Overhead Strips -->
  <line x1="150" y1="80" x2="350" y2="80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="450" y1="80" x2="650" y2="80" stroke="url(#neonOrange)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Center Gym Floor Silhouette Branding -->
  <circle cx="400" cy="300" r="110" fill="#0d1c32" stroke="url(#neonOrange)" stroke-width="4"/>
  <path d="M370 260 L400 230 L430 260 L400 290 Z" fill="url(#neonOrange)"/>
  <rect x="330" y="305" width="140" height="10" rx="5" fill="#ffffff"/>
  <rect x="338" y="293" width="10" height="34" rx="3" fill="url(#neonOrange)"/>
  <rect x="452" y="293" width="10" height="34" rx="3" fill="url(#neonOrange)"/>
  <text x="400" y="355" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">LORD'S GYM</text>
  <text x="400" y="375" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="url(#neonOrange)" text-anchor="middle" letter-spacing="4">SACHIN • SURAT</text>
  
  <rect x="230" y="470" width="340" height="48" rx="24" fill="#0d1c32" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="500" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#f8fafc" text-anchor="middle" letter-spacing="2">AUTHENTIC TRAINING ARENA</text>
</svg>
