<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1c32"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd761a"/>
      <stop offset="100%" stop-color="#ff944d"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="200" height="200" rx="32" fill="url(#shieldGrad)"/>
  <path d="M100 24 L165 48 C165 110 135 155 100 176 C65 155 35 110 35 48 Z" fill="#091526" stroke="url(#accentGrad)" stroke-width="4"/>
  <!-- Crown Icon at top -->
  <path d="M78 68 L88 78 L100 62 L112 78 L122 68 L118 88 L82 88 Z" fill="url(#accentGrad)"/>
  <!-- Barbell Graphic -->
  <rect x="55" y="108" width="90" height="8" rx="4" fill="#ffffff"/>
  <!-- Barbell Plates Left -->
  <rect x="62" y="96" width="6" height="32" rx="3" fill="url(#accentGrad)"/>
  <rect x="71" y="101" width="5" height="22" rx="2" fill="#ffffff"/>
  <!-- Barbell Plates Right -->
  <rect x="132" y="96" width="6" height="32" rx="3" fill="url(#accentGrad)"/>
  <rect x="124" y="101" width="5" height="22" rx="2" fill="#ffffff"/>
  <!-- Center Monogram "LG" -->
  <text x="100" y="148" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">LORD'S</text>
  <text x="100" y="165" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="3">GYM</text>
</svg>
